# nginx для THE MAIN — самодостаточный конфиг (HTTP→HTTPS, лендинг, шрифты, админка,
# заголовки безопасности). Кладётся в /etc/nginx/sites-available/themain.
# Деплой: cp -> nginx -t -> systemctl reload nginx  (certbot повторно запускать НЕ нужно).
# Если nginx -t ругнётся на сертификат/options-ssl — один раз выполните:
#   certbot --nginx -d themainpsychology.ru -d www.themainpsychology.ru --redirect

# --- HTTP: ACME-проверка + принудительный редирект на HTTPS (для всех путей) ---
server {
    listen 80;
    server_name themainpsychology.ru www.themainpsychology.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    server_name themainpsychology.ru www.themainpsychology.ru;

    ssl_certificate /etc/letsencrypt/live/themainpsychology.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/themainpsychology.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;   # не раскрываем версию nginx
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/themain/web;

    # лендинг The MAIN на корне
    location = / { try_files /index.html =404; }

    # самостоятельно захостенные шрифты
    location /fonts/ { expires 30d; access_log off; try_files $uri =404; }

    # загруженные картинки НЕ отдаём напрямую (превью — через авторизованный /admin/media/...)
    location /media/ { return 404; }

    # админка
    location /admin {
        # Ограничить по IP можно здесь или через ADMIN_ALLOW_IPS в .env:
        # allow 203.0.113.10;
        # deny all;
        proxy_pass http://127.0.0.1:8000;   # без завершающего слэша: префикс /admin сохраняется
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- CloudPayments: платёжная страница с виджетом ---
    # add_header в location ПОЛНОСТЬЮ переопределяет серверные — поэтому здесь
    # заголовки перечислены заново, с ослабленным CSP только для домена виджета.
    location = /pay {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://widget.cloudpayments.ru; connect-src 'self' https://widget.cloudpayments.ru https://api.cloudpayments.ru; frame-src https://widget.cloudpayments.ru https:; img-src 'self' data: https:; base-uri 'none'; frame-ancestors 'none'; form-action 'self' https://widget.cloudpayments.ru" always;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- CloudPayments: приём вебхуков (Check/Pay/Fail), подпись проверяется в приложении ---
    location /cloudpayments/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 6m;   # запас под загрузку картинок (лимит в приложении — 5 МБ)
}
